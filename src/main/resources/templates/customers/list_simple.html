<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Mini Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block bg-dark sidebar vh-100 position-fixed">
                <div class="pt-3">
                    <a href="/"
                        class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                        <i class="bi bi-bank fs-4 me-2"></i>
                        <span class="fs-4">Mini Bank</span>
                    </a>
                    <hr class="text-white">
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item">
                            <a href="/" class="nav-link text-white">
                                <i class="bi bi-speedometer2 me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li>
                            <a href="/customers" class="nav-link active text-white" aria-current="page">
                                <i class="bi bi-people me-2"></i>
                                Customers
                            </a>
                        </li>
                        <li>
                            <a href="/accounts" class="nav-link text-white">
                                <i class="bi bi-credit-card me-2"></i>
                                Accounts
                            </a>
                        </li>
                        <li>
                            <a href="/transactions" class="nav-link text-white">
                                <i class="bi bi-arrow-left-right me-2"></i>
                                Transactions
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main content -->
            <div class="col-md-9 ms-sm-auto col-lg-10 px-md-4 offset-md-3 offset-lg-2">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-people"></i> Customers</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="/customers/create" class="btn btn-primary">
                            <i class="bi bi-person-plus"></i> Create Customer
                        </a>
                    </div>
                </div>

                <!-- Success/Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert"
                    xmlns:th="http://www.thymeleaf.org">
                    <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert"
                    xmlns:th="http://www.thymeleaf.org">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Customers Table -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">All Customers</h6>
                    </div>
                    <div class="card-body">
                        <div th:if="${customers.empty}" class="text-center py-4" xmlns:th="http://www.thymeleaf.org">
                            <i class="bi bi-people display-1 text-muted"></i>
                            <h5 class="mt-3 text-muted">No customers found</h5>
                            <p class="text-muted">Get started by adding your first customer.</p>
                            <a href="/customers/new" class="btn btn-primary">
                                <i class="bi bi-person-plus"></i> Add First Customer
                            </a>
                        </div>

                        <div th:unless="${customers.empty}" class="table-responsive"
                            xmlns:th="http://www.thymeleaf.org">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>KYC Status</th>
                                        <th>Created Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="customer : ${customers}">
                                        <td>
                                            <small class="font-monospace"
                                                th:text="${#strings.substring(customer.id.toString(), 0, 8) + '...'}"></small>
                                        </td>
                                        <td th:text="${customer.name}"></td>
                                        <td th:text="${customer.email}"></td>
                                        <td>
                                            <span th:if="${customer.kycStatus == 'PENDING'}"
                                                class="badge bg-warning">Pending</span>
                                            <span th:if="${customer.kycStatus == 'APPROVED'}"
                                                class="badge bg-success">Approved</span>
                                            <span th:if="${customer.kycStatus == 'REJECTED'}"
                                                class="badge bg-danger">Rejected</span>
                                        </td>
                                        <td th:text="${#temporals.format(customer.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td>
                                            <div class="btn-group" role="group">
                                                <a th:href="@{/customers/{id}(id=${customer.id})}"
                                                    class="btn btn-sm btn-outline-primary">
                                                    <i class="bi bi-eye"></i> View
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
