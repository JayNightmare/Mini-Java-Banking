<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::#content})}">

<head>
    <title>Customers - Mini Bank</title>
</head>

<body>
    <div id="content">
        <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2"><i class="bi bi-people"></i> Customers</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a href="/customers/new" class="btn btn-primary">
                    <i class="bi bi-person-plus"></i> Add New Customer
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h6 class="m-0 font-weight-bold">All Customers</h6>
            </div>
            <div class="card-body">
                <div th:if="${customers.empty}" class="text-center py-4">
                    <i class="bi bi-people display-1 text-muted"></i>
                    <h5 class="mt-3 text-muted">No customers found</h5>
                    <p class="text-muted">Get started by adding your first customer.</p>
                    <a href="/customers/new" class="btn btn-primary">
                        <i class="bi bi-person-plus"></i> Add First Customer
                    </a>
                </div>

                <div th:unless="${customers.empty}" class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>KYC Status</th>
                                <th>Created Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="customer : ${customers}">
                                <td>
                                    <small class="font-monospace"
                                        th:text="${#strings.substring(customer.id.toString(), 0, 8) + '...'}"></small>
                                </td>
                                <td th:text="${customer.name}"></td>
                                <td th:text="${customer.email}"></td>
                                <td>
                                    <span th:if="${customer.kycStatus == 'PENDING'}"
                                        class="badge bg-warning">Pending</span>
                                    <span th:if="${customer.kycStatus == 'APPROVED'}"
                                        class="badge bg-success">Approved</span>
                                    <span th:if="${customer.kycStatus == 'REJECTED'}"
                                        class="badge bg-danger">Rejected</span>
                                </td>
                                <td th:text="${#temporals.format(customer.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/customers/{id}(id=${customer.id})}"
                                            class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye"></i> View
                                        </a>
                                        <a th:href="@{/customers/{id}/edit(id=${customer.id})}"
                                            class="btn btn-sm btn-outline-secondary">
                                            <i class="bi bi-pencil"></i> Edit
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
