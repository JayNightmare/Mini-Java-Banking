<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Customer - Mini Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block bg-dark sidebar vh-100 position-fixed">
                <div class="pt-3">
                    <a href="/"
                        class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                        <i class="bi bi-bank fs-4 me-2"></i>
                        <span class="fs-4">Mini Bank</span>
                    </a>
                    <hr class="text-white">
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item">
                            <a href="/" class="nav-link text-white">
                                <i class="bi bi-speedometer2 me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li>
                            <a href="/customers" class="nav-link active text-white" aria-current="page">
                                <i class="bi bi-people me-2"></i>
                                Customers
                            </a>
                        </li>
                        <li>
                            <a href="/accounts" class="nav-link text-white">
                                <i class="bi bi-credit-card me-2"></i>
                                Accounts
                            </a>
                        </li>
                        <li>
                            <a href="/transactions" class="nav-link text-white">
                                <i class="bi bi-arrow-left-right me-2"></i>
                                Transactions
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main content -->
            <div class="col-md-9 ms-sm-auto col-lg-10 px-md-4 offset-md-3 offset-lg-2">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-person-plus"></i> Create New Customer</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="/customers" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Customers
                        </a>
                    </div>
                </div>

                <!-- Customer Form -->
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">Customer Information</h6>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/customers/create}" th:object="${customer}" method="post"
                                    xmlns:th="http://www.thymeleaf.org">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="name" class="form-label">Full Name *</label>
                                            <input type="text" class="form-control" th:field="*{name}"
                                                th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="name"
                                                placeholder="Enter full name" required>
                                            <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback">
                                                <span th:errors="*{name}"></span>
                                            </div>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label for="email" class="form-label">Email Address *</label>
                                            <input type="email" class="form-control" th:field="*{email}"
                                                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" id="email"
                                                placeholder="Enter email address" required>
                                            <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback">
                                                <span th:errors="*{email}"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="kycStatus" class="form-label">KYC Status</label>
                                        <select class="form-select" th:field="*{kycStatus}" id="kycStatus">
                                            <option value="PENDING">Pending</option>
                                            <option value="APPROVED">Approved</option>
                                            <option value="REJECTED">Rejected</option>
                                        </select>
                                    </div>

                                    <div class="alert alert-info">
                                        <i class="bi bi-info-circle"></i>
                                        <strong>Note:</strong> A unique customer ID will be automatically generated upon
                                        creation.
                                    </div>

                                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                        <a href="/customers" class="btn btn-secondary me-md-2">
                                            <i class="bi bi-x"></i> Cancel
                                        </a>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-check"></i> Create Customer
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
