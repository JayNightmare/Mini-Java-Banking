<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::#content})}">

<head>
    <title>Accounts - Mini Bank</title>
</head>

<body>
    <div id="content">
        <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2"><i class="bi bi-credit-card"></i> Accounts</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a href="/accounts/new" class="btn btn-primary">
                    <i class="bi bi-plus"></i> Create New Account
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h6 class="m-0 font-weight-bold">All Accounts</h6>
            </div>
            <div class="card-body">
                <div th:if="${accounts.empty}" class="text-center py-4">
                    <i class="bi bi-credit-card display-1 text-muted"></i>
                    <h5 class="mt-3 text-muted">No accounts found</h5>
                    <p class="text-muted">Create the first account to get started.</p>
                    <a href="/accounts/new" class="btn btn-primary">
                        <i class="bi bi-plus"></i> Create First Account
                    </a>
                </div>

                <div th:unless="${accounts.empty}" class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Account ID</th>
                                <th>IBAN</th>
                                <th>Customer ID</th>
                                <th>Currency</th>
                                <th>Status</th>
                                <th>Created Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="account : ${accounts}">
                                <td>
                                    <small class="font-monospace"
                                        th:text="${#strings.substring(account.id.toString(), 0, 8) + '...'}"></small>
                                </td>
                                <td>
                                    <code th:text="${account.iban}"></code>
                                </td>
                                <td>
                                    <small class="font-monospace"
                                        th:text="${#strings.substring(account.customerId.toString(), 0, 8) + '...'}"></small>
                                </td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${account.currency}"></span>
                                </td>
                                <td>
                                    <span th:if="${account.status == 'ACTIVE'}" class="badge bg-success">Active</span>
                                    <span th:if="${account.status == 'SUSPENDED'}"
                                        class="badge bg-warning">Suspended</span>
                                    <span th:if="${account.status == 'CLOSED'}" class="badge bg-danger">Closed</span>
                                </td>
                                <td th:text="${#temporals.format(account.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/accounts/{id}(id=${account.id})}"
                                            class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye"></i> View
                                        </a>
                                        <a th:href="@{/transactions/transfer?fromAccount={id}(id=${account.id})}"
                                            class="btn btn-sm btn-outline-success">
                                            <i class="bi bi-arrow-right"></i> Transfer
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
