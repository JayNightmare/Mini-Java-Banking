<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts - Mini Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block bg-dark sidebar vh-100 position-fixed">
                <div class="pt-3">
                    <a href="/"
                        class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                        <i class="bi bi-bank fs-4 me-2"></i>
                        <span class="fs-4">Mini Bank</span>
                    </a>
                    <hr class="text-white">
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item">
                            <a href="/" class="nav-link text-white">
                                <i class="bi bi-speedometer2 me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li>
                            <a href="/customers" class="nav-link text-white">
                                <i class="bi bi-people me-2"></i>
                                Customers
                            </a>
                        </li>
                        <li>
                            <a href="/accounts" class="nav-link active text-white" aria-current="page">
                                <i class="bi bi-credit-card me-2"></i>
                                Accounts
                            </a>
                        </li>
                        <li>
                            <a href="/transactions" class="nav-link text-white">
                                <i class="bi bi-arrow-left-right me-2"></i>
                                Transactions
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main content -->
            <div class="col-md-9 ms-sm-auto col-lg-10 px-md-4 offset-md-3 offset-lg-2">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-credit-card"></i> Accounts</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="/accounts/create" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> Create Account
                        </a>
                    </div>
                </div>

                <!-- Success Message -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert"
                    xmlns:th="http://www.thymeleaf.org">
                    <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Accounts Table -->
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">All Accounts</h6>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(accounts)}" class="text-center py-5"
                            xmlns:th="http://www.thymeleaf.org">
                            <i class="bi bi-credit-card display-1 text-muted mb-3"></i>
                            <h5 class="text-muted">No accounts found</h5>
                            <p class="text-muted">Create your first account to get started.</p>
                            <a href="/accounts/create" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> Create First Account
                            </a>
                        </div>

                        <div th:if="${!#lists.isEmpty(accounts)}" class="table-responsive"
                            xmlns:th="http://www.thymeleaf.org">
                            <table class="table table-bordered table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th><i class="bi bi-hash"></i> Account Number</th>
                                        <th><i class="bi bi-person"></i> Customer</th>
                                        <th><i class="bi bi-tag"></i> Type</th>
                                        <th><i class="bi bi-currency-dollar"></i> Balance</th>
                                        <th><i class="bi bi-calendar"></i> Created</th>
                                        <th><i class="bi bi-gear"></i> Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="account : ${accounts}">
                                        <td>
                                            <span class="badge bg-secondary" th:text="${account.accountNumber}"></span>
                                        </td>
                                        <td>
                                            <span th:text="${account.customer?.name ?: 'Unknown'}"></span>
                                            <br>
                                            <small class="text-muted"
                                                th:text="${account.customer?.email ?: ''}"></small>
                                        </td>
                                        <td>
                                            <span class="badge"
                                                th:classappend="${account.accountType == 'CHECKING'} ? 'bg-primary' : 
                                                                 (${account.accountType == 'SAVINGS'} ? 'bg-success' : 'bg-info')"
                                                th:text="${account.accountType}">
                                            </span>
                                        </td>
                                        <td>
                                            <strong
                                                th:text="${account.balance != null ? '$' + #numbers.formatDecimal(account.balance.amount, 1, 2) : '$0.00'}"></strong>
                                            <br>
                                            <small class="text-muted"
                                                th:text="${account.balance?.currency ?: 'USD'}"></small>
                                        </td>
                                        <td>
                                            <span
                                                th:text="${#temporals.format(account.createdAt, 'MMM dd, yyyy')}"></span>
                                            <br>
                                            <small class="text-muted"
                                                th:text="${#temporals.format(account.createdAt, 'HH:mm')}"></small>
                                        </td>
                                        <td>
                                            <div class="btn-group" role="group">
                                                <a th:href="@{'/accounts/' + ${account.id}}"
                                                    class="btn btn-sm btn-outline-primary">
                                                    <i class="bi bi-eye"></i> View
                                                </a>
                                                <a th:href="@{'/accounts/' + ${account.id} + '/edit'}"
                                                    class="btn btn-sm btn-outline-secondary">
                                                    <i class="bi bi-pencil"></i> Edit
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Quick Stats -->
                <div th:if="${!#lists.isEmpty(accounts)}" class="row" xmlns:th="http://www.thymeleaf.org">
                    <div class="col-lg-4">
                        <div class="card bg-primary text-white shadow">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-white-50 text-uppercase mb-1">Total
                                            Accounts</div>
                                        <div class="h5 mb-0 font-weight-bold" th:text="${#lists.size(accounts)}"></div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="bi bi-credit-card fa-2x text-white-50"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
