spring:
    profiles:
        include: secrets
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
        username: ${DB_USERNAME:bank}
        password: ${DB_PASSWORD:bank}
    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            "[hibernate.jdbc.time_zone]": UTC
            "[hibernate.format_sql]": true
    flyway:
        enabled: true
        locations: classpath:db/migration
    ai:
        openai:
            api-key: ${OPENAI_API_KEY:dummy-key-for-testing}

server:
    port: 8080

management:
    endpoints:
        web:
            exposure:
                include: health,info
